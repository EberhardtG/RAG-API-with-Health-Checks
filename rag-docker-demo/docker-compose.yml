

services:
  backend:
    build: ./backend
    container_name: rag_backend
    ports:
      - "8000:8000"
    env_file: .env

    depends_on:
      - ollama
    volumes:
      # Persistent ChromaDB storage
      - chroma_data:/app/chroma_data

  frontend:
    build: ./frontend
    container_name: rag_frontend
    ports:
    - "8501:8501"
    depends_on:
    - backend


  ollama:
    image: ollama/ollama
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      # Persistent Ollama model storage
      - ollama_data:/root/.ollama

volumes:
  chroma_data:
  ollama_data:
