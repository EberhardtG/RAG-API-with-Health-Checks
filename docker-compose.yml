version: "3.8"

services:
  backend:
    build: ./backend
    container_name: rag_backend
    ports:
      - "8000:8000"
    environment:
      # Backend will call Ollama at this internal hostname
      - OLLAMA_URL=http://ollama:11434
      - MODEL_NAME=llama3.2:1b
    depends_on:
      - ollama
    volumes:
      # Persistent ChromaDB storage
      - chroma_data:/app/chroma_data

  ollama:
    image: ollama/ollama
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      # Persistent Ollama model storage
      - ollama_data:/root/.ollama

volumes:
  chroma_data:
  ollama_data:
